# ijosh.com: a one-page Hugo site that Cloudflare Pages builds from master. Every task runs in
# the toolbox image (docker/Dockerfile) with the repo mounted at /work, so a visual check here
# renders exactly what the goldens hold; the host needs only a container engine and go-task.
# Two tasks run on the host instead: check:brand (curl and cmp) and lint (task and jq).
version: "3"

set: [errexit, pipefail]
silent: true

vars:
  IMAGE: ijosh-toolbox
  ENGINE:
    sh: |
      if [ -n "$ENGINE" ]; then echo "$ENGINE"
      elif command -v container >/dev/null 2>&1 && container system status >/dev/null 2>&1; then echo container
      elif command -v docker >/dev/null 2>&1; then echo docker
      elif command -v container >/dev/null 2>&1; then echo container
      else echo docker
      fi

tasks:
  default:
    desc: Print the menu
    # ponytail: hand-maintained listing -- go-task can neither group nor annotate, so a new
    # task means a row below; menu-drift fails until it has one. `task --list` stays the
    # generated view.
    cmds:
      - |
        b= c= d= r=
        if [ -t 1 ] && [ -z "${NO_COLOR:-}" ]; then
          b=$(printf '\033[1m'); c=$(printf '\033[1;36m'); d=$(printf '\033[2m'); r=$(printf '\033[0m')
        fi
        group() { printf '\n%s   %s\n' "$c$1$r" "$d$2$r"; }
        row() {
          if [ ${#1} -le 26 ]; then printf '  %-26s %s\n' "$1" "$2"
          else printf '  %s\n  %-26s %s\n' "$1" '' "$2"; fi
          [ -z "${3:-}" ] || note "$3"
        }
        note() { printf '  %-26s %s\n' '' "$d$1$r"; }

        printf '\n%s   %s\n' "${b}jshvn/ijosh.com${r}" "${d}the one-page site Cloudflare Pages builds from master${r}"

        group read 'reaches the network, changes nothing'
        row 'task check:brand' 'The brand files kept here match brand.ijosh.com' 'reaches brand.ijosh.com; runs on the host: curl and cmp only'
        row 'task visual:vs-live' 'Diff the local page against the live ijosh.com' 'reaches https://ijosh.com from inside the image'

        group checks 'offline, changes nothing'
        row 'task visual:check' 'Screenshot the build and diff it against the goldens' 'light and dark, desktop and mobile, and the weather at rest against the tile'
        note 'run after any change to layouts/ or assets/'
        row 'task check:meta' 'The built JSON parses; the email address is only in its mailto: link'
        row 'task check:field' 'The field tiles match what scripts/field.mjs writes'
        row 'task lint' 'This menu against the tasks' 'runs on the host: task and jq'

        group build 'writes public/ or committed files'
        row 'task build' 'Production build into public/, as Pages runs it'
        row 'task serve' 'Live-reloading server on http://localhost:1313'
        row 'task field' 'Rewrite static/images/field-{light,dark}.svg'
        row 'task visual:bless' 'Re-capture the goldens in tests/visual/golden/' 'only after an intended visual change; commit the PNGs'

        group toolbox 'the image every task runs in: {{.IMAGE}}, {{.ENGINE}}'
        row 'task image' 'Build it'
        row 'task run -- <cmd>' 'Run any command inside it with the repo mounted'
        row 'task clean' 'Remove build output, visual diffs and the image' 'needed after a docker/Dockerfile edit; image presence is the freshness check'
        echo

  build:
    desc: Production build into public/, as Cloudflare Pages runs it
    deps: [image]
    cmds:
      - task: run
        vars: { CLI_ARGS: hugo --gc }

  serve:
    desc: Live-reloading dev server on http://localhost:1313
    aliases: [server, serv]
    deps: [image]
    cmds:
      # --poll: file events from the host do not reliably cross the engine's mount.
      - task: run
        vars:
          PUBLISH: -p 1313:1313
          CLI_ARGS: hugo server --bind 0.0.0.0 --baseURL http://localhost:1313/ --poll 700ms

  check:meta:
    desc: Fail if the build publishes JSON that does not parse, or the email address outside its mailto link
    deps: [image]
    cmds:
      - task: run
        vars: { CLI_ARGS: hugo --gc }
      - task: run
        vars: { CLI_ARGS: node scripts/check-meta.mjs }

  check:field:
    desc: Fail if the committed field tiles differ from what scripts/field.mjs writes
    deps: [image]
    cmds:
      - task: run
        vars: { CLI_ARGS: node scripts/field.mjs --check }

  field:
    desc: Regenerate the background field tiles (static/images/field-*.svg)
    deps: [image]
    cmds:
      - task: run
        vars: { CLI_ARGS: node scripts/field.mjs }

  check:brand:
    desc: Fail if a brand file kept on this origin (favicon, tokens, fonts) has drifted from brand.ijosh.com
    cmds:
      # The brand files a site serves from its own origin, and so the ones that can go stale.
      - |
        stale=0
        for pair in static/favicon.ico:mark/favicon.ico assets/css/tokens.css:tokens.css \
            static/fonts/graduate-400-latin.woff2:fonts/graduate-400-latin.woff2 \
            static/fonts/montserrat-600-latin.woff2:fonts/montserrat-600-latin.woff2 \
            static/fonts/montserrat-600-latin-ext.woff2:fonts/montserrat-600-latin-ext.woff2 \
            static/fonts/pt-serif-400-latin.woff2:fonts/pt-serif-400-latin.woff2 \
            static/fonts/pt-serif-400-latin-ext.woff2:fonts/pt-serif-400-latin-ext.woff2; do
          local_file=${pair%%:*}; url=https://brand.ijosh.com/${pair#*:}
          curl -sSf --max-time 20 "$url" | cmp -s - "$local_file" \
            || { echo "check:brand: $local_file differs from $url -- copy it over"; stale=1; }
        done
        [ "$stale" = 0 ] && echo "check:brand: every copy matches brand.ijosh.com"
        exit $stale

  visual:check:
    desc: Fail if the current build drifts visually from the golden baseline
    deps: [image]
    cmds:
      - task: run
        vars: { CLI_ARGS: hugo --gc }
      - task: run
        vars: { CLI_ARGS: python3 scripts/visual-diff.py check }

  visual:bless:
    desc: Capture the current build as the golden visual baseline (re-run after intended UI changes)
    deps: [image]
    cmds:
      - task: run
        vars: { CLI_ARGS: hugo --gc }
      - task: run
        vars: { CLI_ARGS: python3 scripts/visual-diff.py bless }

  visual:vs-live:
    desc: Compare the local page against the live site (ijosh.com)
    deps: [image]
    cmds:
      - task: run
        vars: { CLI_ARGS: hugo --gc }
      - task: run
        vars: { CLI_ARGS: python3 scripts/visual-diff.py vs-live }

  lint:
    desc: Fail if a task has no desc or no menu row, or a row names no task
    cmds: [task: menu-drift]

  # Every public task has a desc and a menu row, and every row names a task. default and
  # help are the menu itself. Needs task and jq wherever lint runs.
  menu-drift:
    internal: true
    cmds:
      - |
        rows=$(grep -oE "row ['\"]task [^ '\"]+" '{{.ROOT_TASKFILE}}' | sed -E "s/^row ['\"]task //" || true)
        bad=$(task -t '{{.ROOT_TASKFILE}}' --list-all --json --no-status | jq -r --arg rows "$rows" '
          ($rows | split("\n") | map(select(. != ""))) as $r
          | [.tasks[] | select(.task != "default" and .task != "help")] as $t
          | ($t[] | select(.desc == "") | "task \(.task): no desc; describe it or mark it internal"),
            ($t[] | select(.task | IN($r[]) | not) | "task \(.task): no row in the menu"),
            ($r[] | select(IN($t[].task) | not) | "row task \(.): no such task")')
        [ -z "$bad" ] || { printf '%s\n' "$bad" >&2; exit 1; }

  image:
    desc: Build the toolbox image
    run: once
    # Image presence is the freshness check; a Dockerfile edit needs `task clean` first.
    status:
      - '{{.ENGINE}} image inspect {{.IMAGE}} >/dev/null 2>&1'
    cmds:
      - '{{.ENGINE}} build -t {{.IMAGE}} docker/'

  run:
    desc: 'Run any command in the toolbox image, e.g. task run -- hugo version'
    cmds:
      - >-
        {{.ENGINE}} run --rm -i $(test -t 0 && test -t 1 && echo -t || true)
        --user $(id -u):$(id -g)
        -v "{{.ROOT_DIR}}":/work -w /work
        -e HOME=/tmp
        {{.PUBLISH}}
        {{.IMAGE}} {{.CLI_ARGS}}

  clean:
    desc: Remove build output, visual diffs and the toolbox image
    cmds:
      - rm -rf public resources tests/visual/out .hugo_build.lock hugo_stats.json
      - '{{.ENGINE}} image rm {{.IMAGE}} >/dev/null 2>&1 || true'
