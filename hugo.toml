# Site settings
baseURL = "https://ijosh.com/"
locale = "en-US"
title = "Josh Vaughen - Machine Learning Engineer in Seattle"
disableKinds = ["section", "taxonomy", "RSS"]
enableGitInfo = true

[sitemap]
  changeFreq = 'monthly'
  disable = false
  filename = 'sitemap.xml'
  priority = 0.8

[params]

  # Metadata for search engines and social sharing
  author = "Josh Vaughen"
  firstName = "Josh"
  jobTitle = "Machine Learning Engineer"
  description = "Josh Vaughen is a machine learning engineer in Seattle who builds AI-integrated training systems, lifts heavy, and has solo-traveled 60+ countries."
  shareImage = "https://brand.ijosh.com/share/jshvn-share-1200x630.jpg"
  twitterHandle = "dvnll"

  # Social Links
  [params.social]
    email = "josh@vaughen.net"
    instagram = "https://instagram.com/joshthings"
    linkedin = "https://linkedin.com/in/ijosh"
    github = "https://github.com/jshvn"
    twitter = "https://x.com/dvnll"

  [params.showemail]
    enable = true

  [params.showgithub]
    enable = true

  [params.showtwitter]
    enable = false

  [params.showlocation]
    enable = true

  # The photo in the card
  [params.visual.image]
    enable = true
    file = "https://brand.ijosh.com/photo/profile-1024.jpg"
    position = "center 32%"
